name: campfix
description: >
  CampFix — Smart Campus Complaint Management System.
  Report. Resolve. Improve.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Typography
  google_fonts: ^6.2.1

  # Networking
  dio: ^5.5.0

  # Local storage / token persistence
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UI polish
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    # Space Grotesk — display/headline face: geometric, technical,
    # evokes blueprints & infrastructure diagrams (the app's subject).
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

  assets:
    - assets/images/
    - assets/icons/
